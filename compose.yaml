services:
  fleet-api:
    image: ghcr.io/uyamaa/uyamaa-fleet-api:latest
    build:
      context: .
    container_name: uyamaa_fleet_api
    environment:
      DATABASE_URL: ${DATABASE_URL}
      DEFAULT_USER_ID: ${DEFAULT_USER_ID:-}
      INGEST_API_KEY: ${INGEST_API_KEY:-}
    ports:
      - "8004:8000"
    restart: unless-stopped

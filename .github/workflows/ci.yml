name: Build, Test & Deploy to Oracle VM

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Set up Python
      uses: actions/setup-python@v5
      with:
        python-version: '3.11'

    - name: Install Dependencies
      run: |
        python -m pip install --upgrade pip
        pip install -r requirements.txt

    - name: Run Test Suite
      run: |
        python -m pytest

  deploy:
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest

    steps:
    - name: Deploy to Oracle Cloud Ubuntu VM
      uses: appleboy/ssh-action@v1.0.3
      with:
        host: ${{ secrets.VM_HOST }}
        username: ${{ secrets.VM_USER }}
        key: ${{ secrets.VM_SSH_KEY }}
        script: |
          if [ -d "api-branden" ]; then
            cd api-branden
            git pull origin main
          else
            git clone https://github.com/Uyamaa/api-branden.git
            cd api-branden
          fi

          docker build -t api-branden:latest .
          docker stop api-branden-container || true
          docker rm api-branden-container || true
          docker run -d \
            --name api-branden-container \
            -p 8001:8000 \
            -e DATABASE_URL="${{ secrets.DATABASE_URL }}" \
            --restart always \
            api-branden:latest
